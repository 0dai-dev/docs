name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate templates
        run: python3 scripts/validate_templates.py
      - name: Run smoke test
        run: bash tests/smoke_test.sh
      - name: Run roadmap guardian
        run: python3 scripts/roadmap_guardian.py

  publish:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Verify VERSION file matches tag
        run: |
          file_version="$(cat VERSION | tr -d '[:space:]')"
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "VERSION file ($file_version) does not match tag ($tag_version)" >&2
            exit 1
          fi
      - name: Extract release notes
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          notes_file="release-notes/v${version}.md"
          if [ -f "$notes_file" ]; then
            echo "body<<RELEASE_EOF" >> "$GITHUB_OUTPUT"
            cat "$notes_file" >> "$GITHUB_OUTPUT"
            echo "RELEASE_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body=Release v${version}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
