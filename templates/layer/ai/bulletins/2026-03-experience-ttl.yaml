title: Experience TTL Now Configurable
body: |
  Experience candidates now expire based on ODAI_EXPERIENCE_TTL_DAYS
  environment variable (default: 180 days). Previously this was hardcoded.

  Set a shorter TTL for fast-moving projects:
    export ODAI_EXPERIENCE_TTL_DAYS=90

  Set a longer TTL for stable projects:
    export ODAI_EXPERIENCE_TTL_DAYS=365
action: none
